spring.application.name=modulith-shop
server.port=8080

# GraphQL Configuration
spring.graphql.graphiql.enabled=true
spring.graphql.path=/graphql
spring.graphql.schema.locations=classpath*:graphql/**/


# JPA Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# AUTO_SERVER=TRUE lets H2 console / a second JVM attach without file-lock errors (dev only)
spring.datasource.url=jdbc:h2:file:./data/demo;DB_CLOSE_ON_EXIT=FALSE;
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
# Logging
logging.level.root=INFO
logging.level.com.example=DEBUG

logging.level.org.springframework.web=TRACE



logging.level.org.springframework.graphql=TRACE
